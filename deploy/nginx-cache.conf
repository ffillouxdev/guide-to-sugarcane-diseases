# Cache policy for canedr.cirad.fr (D-CAS 2.0)
#
# Usage: copy to the server, e.g.
#   /etc/nginx/snippets/canedr-cache.conf
# then include it INSIDE the server block, after the security headers include:
#
#   server {
#       ...
#       include /etc/nginx/snippets/canedr-security-headers.conf;
#       include /etc/nginx/snippets/canedr-cache.conf;
#   }
#
# After any change: nginx -t && systemctl reload nginx
# Verify: curl -sI https://canedr.cirad.fr/assets/<hashed>.js | grep -i cache-control
#
# NGINX CAVEAT (see canedr-security-headers.conf): a location that sets
# add_header drops ALL add_header inherited from the server block. Every
# location below therefore RE-INCLUDES the security headers so they are not
# silently lost.

# 1. Hashed build bundles (index-<hash>.js / .css) — content-addressed, so the
#    filename changes on every build. Cache hard, forever.
location ~* ^/assets/index-.*\.(?:js|css)$ {
    include /etc/nginx/snippets/canedr-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# 2. Other static assets (fonts, images, icons, OG image). Names are stable,
#    so use a moderate TTL and revalidate. Bump the asset name if you need an
#    instant refresh.
location ~* \.(?:png|jpe?g|webp|gif|svg|ico|otf|ttf|woff2?)$ {
    include /etc/nginx/snippets/canedr-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always; # 30 days
}

# 3. Confidential disease data (JSON identification keys). Moderate cache.
location /datas/ {
    include /etc/nginx/snippets/canedr-security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always; # 1 day
}

# 4. Files that MUST always be fresh so updates propagate immediately:
#    - index.html references the latest hashed bundle
#    - sw.js is the Service Worker (stale SW = stuck app)
#    - /.vite/manifest.json is read by the SW at install to precache bundles
location = /index.html         { include /etc/nginx/snippets/canedr-security-headers.conf; add_header Cache-Control "no-cache" always; }
location = /sw.js              { include /etc/nginx/snippets/canedr-security-headers.conf; add_header Cache-Control "no-cache" always; }
location = /.vite/manifest.json { include /etc/nginx/snippets/canedr-security-headers.conf; add_header Cache-Control "no-cache" always; }

# 5. PWA / SEO metadata — short cache.
location ~* ^/(manifest\.webmanifest|robots\.txt|sitemap\.xml|llms\.txt)$ {
    include /etc/nginx/snippets/canedr-security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always; # 1 hour
}
