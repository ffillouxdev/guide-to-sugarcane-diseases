# Server block for canedr.cirad.fr (D-CAS 2.0) — deployed copy of
# /etc/nginx/conf.d/canedr.conf on croult. Keep this file in sync with the
# server: after editing, copy it over and run `nginx -t && systemctl reload nginx`.
#
# Includes the security-headers snippet (deploy/nginx-security-headers.conf ->
# /etc/nginx/snippets/canedr-security-headers.conf). NGINX CAVEAT: a location
# that sets its own add_header drops inherited add_header, so every such
# location re-includes the snippet.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name croult.cirad.fr;
    root /usr/share/nginx/website_canedr;
    index index.html;
    ssl_certificate     /etc/pki/tls/certs/croult_cert_bundle.pem;
    ssl_certificate_key /etc/pki/tls/private/croult.cirad.fr.key;

    # Security headers (HTML page + everything without its own add_header)
    include /etc/nginx/snippets/canedr-security-headers.conf;

    # Every valid route is prerendered to its own file (e.g. /fr/catalogue/
    # index.html), so unknown URLs return a real 404 instead of the SPA shell
    # (no more soft-404). Client-side navigation uses the History API and never
    # hits these rules.
    location / {
        try_files $uri $uri/ =404;
    }

    # Serve the prerendered not-found page (keeps the 404 status code).
    error_page 404 /404.html;

    # Hashed build bundles: cache hard. Single Cache-Control header (no more
    # duplicate from `expires` + `add_header`).
    location /assets/ {
        include /etc/nginx/snippets/canedr-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Service worker: must never be cached.
    location /sw.js {
        include /etc/nginx/snippets/canedr-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # PWA manifest: serve with the correct MIME type (was application/octet-stream).
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/canedr-security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
    }
}

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name croult.cirad.fr;
    return 301 https://$host$request_uri;
}
